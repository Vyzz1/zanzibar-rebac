spring:
  application:
    name: tuple-store
  datasource:
    url: jdbc:postgresql://localhost:5432/zanzibar
    username: tuplestore_user
    password: tuplestore_pass
    hikari:
      connection-init-sql: SET search_path TO tuplestore
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tuplestore
  flyway:
    enabled: true
    schemas: tuplestore
    default-schema: tuplestore
    locations: classpath:db/migration
    table: flyway_schema_history
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8082

grpc:
  server:
    port: 9092

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

# HMAC key used to sign Zookies. Override via ZOOKIE_SECRET in real environments.
zookie:
  secret: ${ZOOKIE_SECRET:dev-only-secret-change-me}
