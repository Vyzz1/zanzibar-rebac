spring:
  application:
    name: namespace-manager
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/zanzibar
    username: namespace_user
    password: namespace_pass
    hikari:
      connection-init-sql: SET search_path TO namespace
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: namespace
  flyway:
    enabled: true
    schemas: namespace
    default-schema: namespace
    locations: classpath:db/migration
    table: flyway_schema_history

server:
  port: 8084

grpc:
  server:
    port: 9094

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
