spring:
  application:
    name: namespace-manager
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/zanzibar
    username: namespace_user
    password: namespace_pass
    hikari:
      connection-init-sql: SET search_path TO namespace
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: namespace
  flyway:
    enabled: true
    schemas: namespace
    default-schema: namespace
    locations: classpath:db/migration
    table: flyway_schema_history

server:
  port: 8084

grpc:
  server:
    port: 9094

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

# Callers present `Authorization: Bearer <token>`. Scopes: read (ask), write (change grants),
# admin (change namespace config). The dev default is a single all-scope token — override in real
# environments, or set auth.enabled=false locally to bypass entirely.
auth:
  enabled: ${AUTH_ENABLED:true}
  outbound-token: ${API_TOKEN:dev-only-token-change-me}
  clients:
    - name: dev
      token: ${API_TOKEN:dev-only-token-change-me}
      scopes: [read, write, admin]
