spring:
  application:
    name: check-service
  datasource:
    url: jdbc:postgresql://localhost:5432/zanzibar
    username: checkservice_user
    password: checkservice_pass
    hikari:
      connection-init-sql: SET search_path TO tuplestore
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tuplestore
  # check-service owns no tables; tuple-store's Flyway creates them.
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081

grpc:
  server:
    port: 9091

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
