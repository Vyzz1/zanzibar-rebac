spring:
  application:
    name: check-service
  datasource:
    url: jdbc:postgresql://localhost:5432/zanzibar
    username: checkservice_user
    password: checkservice_pass
    hikari:
      connection-init-sql: SET search_path TO tuplestore
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tuplestore
  # check-service owns no tables; tuple-store's Flyway creates them.
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8081

grpc:
  server:
    port: 9091
  client:
    namespace-manager:
      address: ${NAMESPACE_MANAGER_GRPC:static://localhost:9094}
      negotiation-type: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

# Must match tuple-store's ZOOKIE_SECRET so Zookies minted there validate here.
zookie:
  secret: ${ZOOKIE_SECRET:dev-only-secret-change-me}

# Redis-backed Check cache. A Zookie gates freshness; without one, any cached result is served.
check:
  cache:
    enabled: true
    ttl-seconds: 60

# Callers present `Authorization: Bearer <token>`. Scopes: read (ask), write (change grants),
# admin (change namespace config). The dev default is a single all-scope token — override in real
# environments, or set auth.enabled=false locally to bypass entirely.
auth:
  enabled: ${AUTH_ENABLED:true}
  outbound-token: ${API_TOKEN:dev-only-token-change-me}
  clients:
    - name: dev
      token: ${API_TOKEN:dev-only-token-change-me}
      scopes: [read, write, admin]
