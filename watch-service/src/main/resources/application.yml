spring:
  application:
    name: watch-service
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8083

grpc:
  server:
    port: 9093

# Tuple changes are consumed from a RabbitMQ stream (retained log), so a Watch cursor can be
# replayed later. max-age bounds how far back that is possible.
# Must match tuple-store's ZOOKIE_SECRET so Zookies minted there validate here.
zookie:
  secret: ${ZOOKIE_SECRET:dev-only-secret-change-me}

watch:
  stream:
    max-age: 24h
    prefetch: 100
    offset: next

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
